# Render Blueprint — client-owned API + database + photo storage for Oak & Line.
# Render dashboard → New → Blueprint → pick this repo. A persistent disk needs a paid instance (Starter or higher).
services:
  - type: web
    name: oakline-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: oakline-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_ROUTER
        value: browser
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: DATABASE_PATH
        value: /var/data/oakline.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: TRUST_PROXY
        value: "true"
